name: Simulate releases of other apps

# Stands in for the application repositories that do not exist in the PoC (loader, admin, timeout, ...).
# Each line is what one application repository would send after its own release.

on:
  workflow_dispatch:
    inputs:
      changes:
        description: 'One per line or separated by ";", for example: loader_tag = "release/1.2.1"; db_core_schema = "1.3.0"'
        type: string
        required: true

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Get a token for the release bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: release-poc-config-test
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/release-poc-deployment
          ref: release/2.0.2
          path: templates
      - name: Write into the collecting pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          CHANGES: ${{ inputs.changes }}
        run: |
          echo "$CHANGES" | tr ';' '\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep . > changes.txt
          bash templates/scripts/bump-config.sh test changes.txt "simulated releases of other apps"
