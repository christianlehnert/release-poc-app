name: Forward-port to main

# Release branches (releases/x.y) carry what runs in PROD; main carries the next version.
# A fix merged into a release branch must also reach main, otherwise the next release loses it.
# This workflow does that merge for you: it cherry-picks the new commits of the release branch
# onto a branch from main and opens a pull request. On a conflict it still opens the pull
# request (draft) and says which files need a hand.

on:
  push:
    branches: ['releases/**']

permissions:
  contents: read

concurrency:
  group: forward-port-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  forward-port:
    runs-on: ubuntu-latest
    steps:
      - name: Get a token for the release bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - name: Cherry-pick onto main and open the pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SOURCE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bot_id=$(gh api "/users/${BOT_SLUG}%5Bbot%5D" -q .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "New release branch, nothing to forward-port."; exit 0
          fi
          # only commits that are not in main yet (merge commits skipped, their content comes with the picks)
          mapfile -t commits < <(git rev-list --reverse --no-merges --cherry-pick --right-only "origin/main...${AFTER}" | while read -r c; do git merge-base --is-ancestor "$c" "$BEFORE" || echo "$c"; done)
          if [ ${#commits[@]} -eq 0 ]; then echo "Nothing new for main."; exit 0; fi
          branch="forward-port/${SOURCE//\//-}-${AFTER::7}"
          git switch -q -c "$branch" origin/main
          conflict=""
          for c in "${commits[@]}"; do
            if ! git cherry-pick -x "$c" >/dev/null 2>&1; then
              files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              conflict="${conflict}- \`${c::7}\` $(git log -1 --format=%s "$c"): conflict in ${files}\n"
              git cherry-pick --abort
            fi
          done
          list=$(for c in "${commits[@]}"; do echo "- \`${c::7}\` $(git log -1 --format=%s "$c")"; done)
          if [ -z "$conflict" ]; then
            git push -q origin "$branch"
            url=$(gh pr create --head "$branch" --base main \
              --title "Forward-port ${SOURCE} to main (${#commits[@]} commit(s))" \
              --body "$(printf 'These commits were merged into `%s` and are not in `main` yet:\n\n%s\n\nCherry-picked without conflict. Review and merge, so the next release from main keeps the fix.' "$SOURCE" "$list")")
          else
            git commit -q --allow-empty -m "Forward-port ${SOURCE}: needs manual resolution"
            git push -q origin "$branch"
            url=$(gh pr create --draft --head "$branch" --base main \
              --title "Forward-port ${SOURCE} to main: conflict, needs a hand" \
              --body "$(printf 'Commits from `%s` that could not be applied to `main` automatically:\n\n%b\nResolve on this branch: `git cherry-pick -x <commit>`, fix the files, push.' "$SOURCE" "$conflict")")
          fi
          echo "Forward-port pull request: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
