name: Release Tag

# Runs when a release is published (from main or from a release branch releases/x.y).
# 1. "Tags the image" (simulated: the existing image gets the release tag, nothing is rebuilt).
# 2. Calls the reusable workflow of release-poc-deployment: the release bot writes the version
#    into the collecting pull request of release-poc-config-test.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tag-image:
    runs-on: ubuntu-latest
    steps:
      - name: Tag image (simulated)
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          echo "Image registry.example/app:${TAG//\//-} tagged (built from ${TARGET}). Nothing rebuilt." | tee -a "$GITHUB_STEP_SUMMARY"

  bump-config:
    needs: tag-image
    uses: christianlehnert/release-poc-deployment/.github/workflows/bump-config.yml@release/1.1.0
    with:
      changes: app_tag = "${{ github.event.release.tag_name }}"
      source: "release-poc-app ${{ github.event.release.tag_name }}"
      client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
    secrets:
      private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
